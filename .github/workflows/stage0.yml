name: Offline S0 and S1 verification

on:
  pull_request:
    branches: [main]
  push:
    branches: ["codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage0:
    name: S0/S1 Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify exact source, both stages, causal factors and mature labels
        run: |
          python scripts/verify_stage1.py --output-dir artifacts/s1-ci
      - name: Verify committed schemas and S1 package
        run: |
          git diff --exit-code -- contracts
          test -z "$(git status --porcelain --untracked-files=all -- contracts)"
          python scripts/build_stage1_package.py --commit "$(git rev-parse HEAD)" --evidence-dir artifacts/s1-ci --output-dir artifacts/s1-package
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-verification-python-${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: warn
